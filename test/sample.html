<!doctype html><meta charset=utf-8><style>
body{margin:0;background:#0f1b3d;color:#ffb020;font:700 90px sans-serif;display:grid;place-items:center;height:100vh;overflow:hidden}
.b{width:200px;height:200px;background:#e5484d;animation:m 2s ease-in-out forwards}
@keyframes m{from{transform:translateX(-300px) rotate(0)}to{transform:translateX(300px) rotate(360deg)}}
</style><div class=b></div><script>let n=0;setInterval(()=>{if(n<60)document.title=++n},50)</script>
